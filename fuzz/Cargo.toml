[package]
name = "dhtcrawler4-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# A separate workspace: cargo-fuzz needs nightly and sanitizer flags that the
# main workspace must not inherit. Cargo.lock starts from the main workspace's
# lockfile so both build the same dependency versions.
[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
sha1 = "0.11.0"
dc4-bencode = { path = "../crates/dc4-bencode" }
dc4-core = { path = "../crates/dc4-core" }
dc4-dht = { path = "../crates/dc4-dht" }
dc4-peer = { path = "../crates/dc4-peer" }
dc4-search = { path = "../crates/dc4-search" }
dc4-torrent = { path = "../crates/dc4-torrent" }

[[bin]]
name = "bencode_decode"
path = "fuzz_targets/bencode_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "krpc_message"
path = "fuzz_targets/krpc_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "compact_lists"
path = "fuzz_targets/compact_lists.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_info"
path = "fuzz_targets/parse_info.rs"
test = false
doc = false
bench = false

[[bin]]
name = "peer_frames"
path = "fuzz_targets/peer_frames.rs"
test = false
doc = false
bench = false

[[bin]]
name = "search_query"
path = "fuzz_targets/search_query.rs"
test = false
doc = false
bench = false
